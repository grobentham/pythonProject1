name: V5.3 Self Test

on:
  push:
    branches:
      - xauusd-provider-faithful-v5-3
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Compile V5.3 modules
        run: |
          python -m py_compile v53_policy.py
          python -m py_compile v53_engine.py
          python -m py_compile v53_engine_patch.py
          python -m py_compile replay_blueberry_telegram_v5_3.py
          python -m py_compile test_v53_policy.py
          python -m py_compile test_v53_layered_intended.py
      - name: Check downside stop risk
        run: python -c "from v53_policy import downside_stop_distance as f; assert [f('BUY',100,95),f('BUY',100,100),f('BUY',100,105),f('SELL',100,105),f('SELL',100,100),f('SELL',100,95)] == [5,0,0,5,0,0]"
      - name: Check limit gap fills
        run: python -c "from v53_policy import limit_fill_price as f; assert [f('BUY',2893,2865,2866),f('SELL',2893,2920,2921),f('BUY',2893,2894,2895),f('SELL',2893,2891,2892)] == [2866,2920,2893,2893]"
      - name: Check partial close policy
        run: python -c "from v53_policy import partial_close_count as f; assert [f(1,'CEIL_HALF'),f(2,'CEIL_HALF'),f(3,'CEIL_HALF'),f(3,'FLOOR_HALF')] == [1,1,2,1]"
      - name: Check zone and explicit selection
        run: python -c "from v53_policy import synthetic_zone_entries as z, select_explicit_entries as s; assert z('BUY',100,102,3)==[102.0,101.0,100.0]; assert z('SELL',100,102,3)==[100.0,101.0,102.0]; assert s([100,101,102,103],'BUY')==[100.0,101.0,102.0]; assert s([100,101,102,103],'SELL')==[103.0,102.0,101.0]"
      - name: Check explicit provider parsing
        run: |
          python - <<'PY'
          from v53_policy import explicit_provider_entries
          buy={'side':'BUY','text':'Buy entries: 4625 / 4624 / 4623','zone_low':4623,'zone_high':4625}
          sell={'side':'SELL','text':'Sell entry 4625\nSell entry 4626\nSell entry 4627','zone_low':4625,'zone_high':4627}
          a=explicit_provider_entries(buy,'BUY',4623,4625)
          b=explicit_provider_entries(sell,'SELL',4625,4627)
          print('BUY',a)
          print('SELL',b)
          assert a==[4625.0,4624.0,4623.0]
          assert b==[4625.0,4626.0,4627.0]
          PY
      - name: Run full semantic tests
        run: python test_v53_policy.py
      - name: Run provider-intended layered ladder tests
        run: python test_v53_layered_intended.py
