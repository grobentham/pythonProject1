name: V5.6 Remote Replay Data Inspect

on:
  workflow_dispatch:
  push:
    branches:
      - xauusd-v5.6-provider-canonical
    paths:
      - '.github/workflows/v56-remote-data-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch preserved replay-input branch
        run: |
          git fetch origin chatgpt-xauusd-replay-20260826:refs/remotes/origin/replay-input
          git checkout refs/remotes/origin/replay-input -- xauusd_replay
      - name: Resolve duplicate part variants and inspect tables
        run: |
          python - <<'PY'
          import base64,gzip,pathlib,csv,collections,json,hashlib
          root=pathlib.Path('xauusd_replay')

          def decode_named(names):
              b64=''.join((root/n).read_text().strip() for n in names)
              raw=base64.b64decode(b64,validate=True)
              try:
                  data=gzip.decompress(raw)
                  return True,data,hashlib.sha256(raw).hexdigest(),None
              except Exception as e:
                  return False,b'',hashlib.sha256(raw).hexdigest(),repr(e)

          variants={
              'A_original_04': [f'signals_{i:02d}.b64part' for i in range(4)] + ['signals_04.b64part','signals_05.b64part'],
              'B_split_04abc': [f'signals_{i:02d}.b64part' for i in range(4)] + ['signals_04a.b64part','signals_04b.b64part','signals_04c.b64part','signals_05.b64part'],
          }
          winner=None
          for name,names in variants.items():
              ok,data,sha,err=decode_named(names)
              print(name,'ok',ok,'compressed_sha256',sha,'bytes',len(data),'err',err)
              if ok:
                  text=data.decode('utf-8-sig')
                  rows=list(csv.DictReader(text.splitlines()))
                  invalid=sum(1 for r in rows if r.get('side') not in {'BUY','SELL'})
                  malformed=sum(1 for r in rows if None in r)
                  print(name,'rows',len(rows),'invalid_side',invalid,'malformed',malformed,'columns',list(rows[0]) if rows else [])
                  print(name,'first',json.dumps(rows[:3],ensure_ascii=False))
                  print(name,'last',json.dumps(rows[-3:],ensure_ascii=False))
                  if invalid==0 and malformed==0 and rows:
                      if winner is not None:
                          raise RuntimeError('More than one structurally valid signal reconstruction; freeze requires explicit disambiguation')
                      winner=(name,data,rows,sha)
          if winner is None:
              raise RuntimeError('No CRC-valid structurally clean signal reconstruction')
          name,data,signals,sha=winner
          (root/'signals.csv').write_bytes(data)
          print('SIGNALS_WINNER',name,'rows',len(signals),'raw_compressed_sha256',sha)
          print('signals_side',collections.Counter(r['side'] for r in signals))

          mgmt_names=['management_00.b64part','management_01.b64part','management_02.b64part']
          ok,data,msha,err=decode_named(mgmt_names)
          if not ok: raise RuntimeError(f'management decode failed: {err}')
          management=list(csv.DictReader(data.decode('utf-8-sig').splitlines()))
          if not management or any(None in r for r in management): raise RuntimeError('management malformed')
          (root/'management_compact.csv').write_bytes(data)
          print('MANAGEMENT rows',len(management),'compressed_sha256',msha,'columns',list(management[0]))
          print('management_action_sets',collections.Counter(r['actions'] for r in management).most_common(20))
          print('management first',json.dumps(management[:5],ensure_ascii=False))
          print('management last',json.dumps(management[-5:],ensure_ascii=False))
          PY
