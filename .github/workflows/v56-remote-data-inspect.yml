name: V5.6 Remote Replay Data Inspect

on:
  workflow_dispatch:
  push:
    branches:
      - xauusd-v5.6-provider-canonical
    paths:
      - '.github/workflows/v56-remote-data-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch preserved replay-input branch
        run: |
          git fetch origin chatgpt-xauusd-replay-20260826:refs/remotes/origin/replay-input
          git checkout refs/remotes/origin/replay-input -- xauusd_replay
      - name: Decode tables and inspect
        run: |
          python - <<'PY'
          import base64, gzip, pathlib, csv, collections, json, hashlib, zlib, struct
          root=pathlib.Path('xauusd_replay')

          def decode_parts(pattern):
              parts=sorted(root.glob(pattern))
              if not parts:
                  raise RuntimeError(f'No parts for {pattern}')
              print(pattern, 'parts', [(p.name,p.stat().st_size) for p in parts])
              b64=''.join(p.read_text().strip() for p in parts)
              raw=base64.b64decode(b64, validate=True)
              print(pattern, 'compressed_bytes', len(raw), 'sha256', hashlib.sha256(raw).hexdigest())
              try:
                  return gzip.decompress(raw), 'GZIP_CRC_OK'
              except gzip.BadGzipFile as exc:
                  print(pattern, 'gzip_crc_warning', repr(exc))
                  if raw[:2] != b'\x1f\x8b':
                      raise
                  # Standard gzip stream: fixed 10-byte header in these frozen files,
                  # 8-byte CRC/ISIZE trailer. Recover deflate payload without trusting
                  # the stale trailer, then validate the resulting CSV structurally.
                  data=zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)
                  expected_isize=struct.unpack('<I', raw[-4:])[0]
                  print(pattern, 'recovered_bytes',len(data),'trailer_isize',expected_isize,
                        'recovered_sha256',hashlib.sha256(data).hexdigest())
                  return data, 'RECOVERED_IGNORE_STALE_GZIP_CRC'

          for pattern,dst in [('signals_*.b64part','signals.csv'),('management_*.b64part','management_compact.csv')]:
              data,status=decode_parts(pattern)
              path=root/dst
              path.write_bytes(data)
              with path.open(encoding='utf-8-sig', newline='') as f:
                  rows=list(csv.DictReader(f))
              if not rows:
                  raise RuntimeError(f'{dst}: zero rows')
              if any(None in r for r in rows[:100]):
                  raise RuntimeError(f'{dst}: malformed CSV rows')
              print('\n###', dst, status)
              print('rows',len(rows))
              print('columns', list(rows[0]))
              for r in rows[:8]: print(json.dumps(r, ensure_ascii=False))
              for field in ('side','kind','action','status','management_type','type'):
                  if field in rows[0]:
                      print(field, collections.Counter(r.get(field,'') for r in rows).most_common(30))
          PY
