name: V5.6 Causal S1000 Public M1 Account Survival

on:
  workflow_dispatch:
  push:
    branches:
      - xauusd-v5.6-provider-canonical
    paths:
      - '.github/workflows/v56-public-m1-account-survival.yml'
      - 'v56_public_m1_account_survival.py'

jobs:
  survival:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Fetch and reconstruct frozen compact provider inputs
        run: |
          git fetch origin chatgpt-xauusd-replay-20260826:refs/remotes/origin/replay-input
          git checkout refs/remotes/origin/replay-input -- xauusd_replay
          python - <<'PY'
          import base64,gzip,pathlib,hashlib
          root=pathlib.Path('xauusd_replay')
          sig_names=[f'signals_{i:02d}.b64part' for i in range(4)] + ['signals_04a.b64part','signals_04b.b64part','signals_04c.b64part','signals_05.b64part']
          mgmt_names=['management_00.b64part','management_01.b64part','management_02.b64part']
          def decode(names,dst,expected):
              raw=base64.b64decode(''.join((root/n).read_text().strip() for n in names),validate=True)
              sha=hashlib.sha256(raw).hexdigest(); assert sha==expected,(dst,sha)
              data=gzip.decompress(raw); (root/dst).write_bytes(data)
              print(dst,sha,len(data))
          decode(sig_names,'signals.csv','f472ccad02aaef9c3a18f511263b35e3e0d8d1b0c9dc43a637f535df4ea705ad')
          decode(mgmt_names,'management_compact.csv','0b05c33cf080c6ee532658f408a069a5bced789e8a61403c8f88410835404090')
          PY
      - name: Download preserved public M1 Bid Ask dataset
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import pathlib,time,urllib.request
          root=pathlib.Path('xauusd_replay/data')
          for side in ('bid','ask'):(root/side).mkdir(parents=True,exist_ok=True)
          months=[];y,m=2023,5
          while (y,m)<=(2026,8):
              months.append((y,m));m+=1
              if m==13:y+=1;m=1
          jobs=[(f'https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/{side}/m1/xauusd_{side}_m1_{y:04d}_{m:02d}.csv',root/side/f'xauusd_{side}_m1_{y:04d}_{m:02d}.csv') for side in ('bid','ask') for y,m in months]
          def get(job):
              url,out=job
              for attempt in range(5):
                  try:
                      urllib.request.urlretrieve(url,out)
                      if out.stat().st_size<1000: raise RuntimeError('small file')
                      return out.stat().st_size
                  except Exception:
                      if attempt==4: raise
                      time.sleep(2*(attempt+1))
          total=0
          with ThreadPoolExecutor(max_workers=8) as ex:
              futs=[ex.submit(get,j) for j in jobs]
              for i,f in enumerate(as_completed(futs),1):
                  total+=f.result()
                  if i%20==0 or i==len(futs): print('downloaded',i,'/',len(futs),'bytes',total,flush=True)
          PY
      - name: Compile survival engine
        run: python -m py_compile v56_public_m1_account_survival.py
      - name: Run causal S1000 account survival replay
        run: python v56_public_m1_account_survival.py
      - name: Show result
        if: always()
        run: |
          if [ -f xauusd_replay/v56_account_survival_output/summary.json ]; then cat xauusd_replay/v56_account_survival_output/summary.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V56_CAUSAL_S1000_PUBLIC_M1_ACCOUNT_SURVIVAL
          path: xauusd_replay/v56_account_survival_output/
          if-no-files-found: warn
          retention-days: 7
